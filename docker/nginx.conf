server {
    # Cloud Run injects PORT and defaults to 8080. nginx cannot read an environment variable in a
    # config file, so the number is fixed here and the service is deployed with --port=8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # $uri/ below makes nginx redirect /agencies to /agencies/, and by default it builds that
    # Location header from its own listen address — http://<host>:8080/agencies/. Behind Cloud Run
    # the client reached us on https:443, so that URL points at a port nothing serves and the visit
    # dies. Relative redirects let the browser reuse the scheme and authority it already has.
    #
    # Only direct hits are affected — in-app navigation is client-side and never asks nginx — which
    # is what makes it easy to miss: every link works while you click around, and a shared link or a
    # refresh on /agencies does not.
    absolute_redirect off;
    port_in_redirect off;

    # Evidence prerenders every page to its own directory, so /agencies is really
    # /agencies/index.html. Without this, any URL other than the root 404s on refresh.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # The parquet files Evidence materialises at build time are content-addressed and immutable;
    # the HTML that points at them is not. Caching them the same way would serve a stale dashboard
    # from the browser long after a rebuild.
    location ~* \.(parquet|arrow|js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
