# The platform's Terraform creates the Google service account and the workloadIdentityUser binding
# that names p03-elt/dbt, but it does not create this object. Without it, or with a different name,
# every pod falls back to the node identity and loses BigQuery access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dbt
  namespace: p03-elt
  annotations:
    iam.gke.io/gcp-service-account: wl-p03-elt@varun-data-engineering.iam.gserviceaccount.com
