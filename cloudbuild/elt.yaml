steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --file=docker/Dockerfile.elt
      - --tag=${_IMAGE}:${_TAG}
      - --tag=${_IMAGE}:latest
      - .

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/varun-data-engineering/data-platform/p03-elt
  _TAG: dev

options:
  machineType: E2_HIGHCPU_8
  # Required when the build has no user-specified logs bucket.
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
