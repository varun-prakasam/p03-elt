# Compile the Evidence site, bake it into nginx, deploy to Cloud Run.
#
# The compile is a build step rather than a Docker stage on purpose: `evidence sources` runs every
# source query against BigQuery and materialises the results to parquet, which needs credentials.
# A build step reaches the metadata server and picks up Application Default Credentials; a docker
# build does not, and the alternative would be handing a key file to a container.

steps:
  - name: node:20
    id: install
    dir: evidence
    entrypoint: npm
    # A plain install, deliberately. --legacy-peer-deps resolves the tree but stops npm installing
    # peer dependencies at all, and SvelteKit needs @sveltejs/vite-plugin-svelte present at build
    # time — so the install succeeds and `evidence build` then fails. The actual conflict is pinned
    # away in package.json instead.
    args: ['install', '--no-audit', '--no-fund']

  - name: node:20
    id: sources
    dir: evidence
    entrypoint: npx
    args: ['evidence', 'sources']
    env:
      - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'

  # The dbt lineage graph is the most convincing single artifact this project produces, and the
  # artifacts bucket it is published to has public access prevention on. Rather than punch a hole in
  # the bucket, mirror the docs into the site so both are served from the one public origin.
  #
  # Placed in static/ before the build rather than dropped into build/ after it, because
  # build:strict prerenders every link and fails on a 404. The dashboard's link to the lineage graph
  # has to resolve while the site is compiling, which means the files have to be there first.
  #
  # The placeholder matters for the same reason: on a first deploy the pipeline has not published
  # docs yet, and a missing lineage graph should not withhold the whole dashboard.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: dbt-docs
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p evidence/static/dbt-docs
        gsutil -m cp -r "gs://varun-data-engineering-artifacts/p03/docs/*" evidence/static/dbt-docs/ \
          || echo "no published dbt docs in the bucket yet"
        if [ ! -f evidence/static/dbt-docs/index.html ]; then
          echo "writing placeholder so the strict build's link check passes"
          echo '<!doctype html><meta charset=utf-8><title>dbt docs</title><p>The dbt documentation has not been published yet. It is generated by the nightly pipeline.</p>' \
            > evidence/static/dbt-docs/index.html
        fi

  - name: node:20
    id: build
    dir: evidence
    entrypoint: npx
    # build:strict fails the build on a query or component error. The point of a nightly rebuild is
    # to catch a mart that changed shape; a lenient build would publish the broken page instead.
    args: ['evidence', 'build:strict']
    env:
      - 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'

  - name: gcr.io/cloud-builders/docker
    id: image
    args:
      - build
      - --file=docker/Dockerfile.evidence
      - --tag=${_IMAGE}:${_TAG}
      - --tag=${_IMAGE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args: ['push', '--all-tags', '${_IMAGE}']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --cpu=1
      - --memory=512Mi
      # The site is static parquet and HTML; nothing here talks to BigQuery at request time, so the
      # runtime identity needs no data access at all.
      - --service-account=${_RUNTIME_SA}
      - --quiet

  # --allow-unauthenticated above does not survive --quiet: gcloud normally prompts before making a
  # service world-readable, and suppressing the prompt suppresses the binding with it. The deploy
  # then reports success while every request returns 403.
  #
  # Checked by fetching the site the way a visitor does, rather than by reading the IAM policy.
  # An unauthenticated GET is the thing we actually care about, it catches a 403 whatever the cause,
  # and it needs no permission — this build's identity can deploy a service but cannot read or set
  # its IAM policy, so a policy-based check would fail on services that are perfectly healthy.
  #
  # The binding itself persists across deploys and only has to be set once, out of band:
  #   gcloud run services add-iam-policy-binding api-p03-elt \
  #     --region=us-central1 --member=allUsers --role=roles/run.invoker
  #
  # Public is the intent. The service is prerendered HTML and parquet describing public city data,
  # and it holds no credential — the portfolio is the point.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: verify-public
    entrypoint: bash
    args:
      - -c
      - |
        url=$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')
        echo "checking $${url} anonymously"
        for page in / /agencies /weather /dbt-docs/index.html; do
          # -L because Evidence prerenders each page to its own directory, so /agencies legitimately
          # redirects to /agencies/. Following it also proves the redirect target is reachable,
          # which caught nginx handing out an absolute http://host:8080/ Location that no client
          # outside the container could ever fetch.
          code=$(curl -sL --max-time 30 -o /dev/null -w '%{http_code}' "$${url}$${page}")
          echo "  $${code}  $${page}"
          if [ "$${code}" != "200" ]; then
            echo "FAILED: $${page} returned $${code}, not 200."
            echo "If this is 403 the service is not world-readable. Run:"
            echo "  gcloud run services add-iam-policy-binding ${_SERVICE} \\"
            echo "    --region=${_REGION} --member=allUsers --role=roles/run.invoker"
            exit 1
          fi
        done
        echo "all pages served anonymously"

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/varun-data-engineering/data-platform/p03-evidence
  _TAG: dev
  _SERVICE: api-p03-elt
  _REGION: us-central1
  _RUNTIME_SA: api-p03-elt@varun-data-engineering.iam.gserviceaccount.com

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
